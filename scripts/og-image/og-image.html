<!doctype html><html><head><meta charset="utf-8">
<!-- Source of public/og-image-vN.png (1200x630, #13). Render: see CLAUDE.md "Search-engine meta". -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#111111}
body{position:relative;font-family:'Barlow Condensed',sans-serif;color:#F2EDE6}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px}
.glow{position:absolute;left:50%;top:44%;width:900px;height:500px;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(192,57,43,.16),transparent 65%)}
.bar{position:absolute;left:0;right:0;height:8px;background:#C0392B}.top{top:0}.bot{bottom:0}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{width:820px;margin-top:-20px}
.doors{display:flex;gap:28px;align-items:center;margin-top:18px;font-weight:700;font-size:44px;letter-spacing:.06em;text-transform:uppercase}
.doors .dot{width:12px;height:12px;background:#C0392B;transform:rotate(45deg)}
.line{margin-top:14px;font-family:'Barlow',sans-serif;font-weight:500;font-size:26px;color:#A09890}
.url{margin-top:30px;font-weight:600;font-size:24px;letter-spacing:.2em;color:#8A847E;text-transform:lowercase}
</style></head><body>
<div class="grid"></div><div class="glow"></div><div class="bar top"></div><div class="bar bot"></div>
<div class="wrap">
<img class="logo" src="../../public/Brand/SF_Logo_Transparent_DarkBG.svg">
<div class="doors"><span>Service &amp; Repair</span><span class="dot"></span><span>Solutions</span></div>
<div class="line">We do the work, and build the systems behind it.</div>
<div class="url">streichforce.com</div>
</div></body></html>
