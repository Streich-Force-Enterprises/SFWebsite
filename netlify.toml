[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# One page per division (#10): /enterprise folded into /services.
# force = true because Astro also writes a fallback page at /enterprise/.
[[redirects]]
  from   = "/enterprise"
  to     = "/services"
  status = 301
  force  = true

[[redirects]]
  from   = "/enterprise/*"
  to     = "/services"
  status = 301
  force  = true
